[package]
name = "gliner2-rs"
version = "0.6.1"
description = "Native Rust inference for GLiNER2 on ONNX Runtime: entities, relations and classification, with PII and LLM-guardrail schemas"
readme = "README.md"
keywords = ["nlp", "ner", "onnx", "inference", "gliner"]
categories = ["science", "text-processing"]
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ort.workspace = true
ndarray.workspace = true
tokenizers.workspace = true
anyhow.workspace = true
half.workspace = true
regex.workspace = true
hf-hub = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
serde.workspace = true

[features]
default = ["guardrails", "privacy", "hub"]

# The model-specific vocabularies. On by default: anyone using one of these
# checkpoints wants them, and they are tables of labels plus a few helpers - a
# few KB, no extra dependencies. They are features rather than separate crates
# because splitting them meant five packages that were always installed
# together.
guardrails = []
privacy = []

# Fetches a published export from the Hub when the model directory is empty.
# On by default: a crate that cannot obtain its own weights makes every caller
# write the same download step. `hf-hub` comes in without default features, so
# TLS resolves through `rustls` and no `openssl` enters the tree. Switching the
# feature off leaves the crate with no network stack at all.
hub = ["dep:hf-hub"]

# Helpers that locate a tokenizer.json under the workspace, for pinning the
# prompt layout against the same ground truth from outside the crate.
test-support = []
