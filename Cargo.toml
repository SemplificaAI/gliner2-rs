[workspace]
resolver = "3"
members = [
    # One crate, not five. The engine, the PII vocabulary and the guardrail
    # schemas ship together because anyone using this model wants all of them;
    # splitting them produced packages that were only ever installed as a set.
    "crates/gliner2-rs",
    # the original engine: edition 2021, V1 pipeline, HuggingFace downloader
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
authors = ["Dario Finardi <df@dariofinardi.it>"]
license = "Apache-2.0"
repository = "https://github.com/dariofinardi/gliner2-rs"
homepage = "https://edito-pdf.com"

[workspace.dependencies]
# One ort version for the whole workspace: mixing release candidates across
# crates would link two incompatible ONNX Runtime bindings into one binary.
#
# Caret, not `=`. An exact pin is right for an application and wrong for a
# published library: it would stop anyone combining these crates with another
# that also depends on ort, and there is no way for them to resolve it. `^` here
# means >=2.0.0-rc.13 and <3.0.0, later release candidates included.
#
# The floor is rc.13 for a concrete reason, not caution. Release candidates 10
# through 12 were tried in this project and rejected: on ARM CPU some models
# hung during session initialisation or inference, reproducibly enough that the
# project stayed on rc.9 for months rather than move to them. rc.13 is the first
# candidate since rc.9 that runs those models on ARM, which is why the migration
# skipped three releases. Do not lower this floor.
#
# Upwards the caret is a calculated risk. Between rc.9 and rc.13, `commit()`
# changed its return type, `Session::run` began taking `&mut self`,
# `try_extract_tensor` started returning a `Shape`, and `Outlet`'s fields went
# private. A future rc can break the build the same way. Pin exactly in your own
# application if you need the guarantee; a library should not impose it.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std", "ndarray", "load-dynamic",
    "cuda", "rocm", "coreml", "openvino", "directml", "tensorrt", "xnnpack", "qnn", "half",
] }
ndarray = "0.17"

# Hub client for the `hub` feature. `default-features = false` with `ureq` alone
# keeps TLS on `rustls`: hf-hub's default set pulls `native-tls` and with it
# `openssl` — a C library and its CVE stream — for no gain here.
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
# Default features pull in `esaxx_fast`, which compiles a C++ translation unit
# through `esaxx-rs/cpp` with the STATIC CRT (/MT) on MSVC. Most C/C++ crates use
# the dynamic one (/MD), and two CRTs in one image is what LNK2038 refuses:
# linking `gliner2-rs` beside `tesseract-rs` fails outright on Windows. A
# consumer cannot undo this — Cargo features are additive — so the choice has to
# be made here.
#
# `esaxx_fast` is trainer-only: in tokenizers 0.23.1 it appears once, at
# models/unigram/trainer.rs:227, and without it the same call takes the pure-Rust
# `esaxx_rs::suffix_rs`. This crate does inference and never trains a Unigram
# model, so the path is unreachable; what disappears is the compiled C++ object.
#
# `fancy-regex` replaces `onig` as the `SysRegex` behind the ByteLevel/Split
# pre-tokenizers — a real change to the inference path, so it was measured
# rather than assumed (see RELEASE_NOTES). It removes a second C dependency.
# One backend is mandatory: `default-features = false` alone fails with
# `compile_error!("One of the `onig`, or `fancy-regex` features must be
# enabled")`. Note that features being additive, a consumer that asks tokenizers
# for `onig` gets it back — onig wins when both are enabled.
tokenizers = { version = "0.23", default-features = false, features = [
    "progressbar",
    "fancy-regex",
] }
anyhow = "1.0"
half = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
