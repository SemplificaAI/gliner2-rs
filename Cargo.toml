[workspace]
resolver = "3"
members = [
    # the engine: prompt construction, ort helpers, overlap policies, span
    # inference. Self-contained, so it publishes under one name.
    "crates/gliner2-core",
    "crates/gliner2-guardrails",
    "crates/gliner2-privacy",
    # the original engine: edition 2021, V1 pipeline, HuggingFace downloader
    "crates/gliner2-inference",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
authors = ["Dario Finardi <df@dariofinardi.it>"]
license = "Apache-2.0"
repository = "https://github.com/dariofinardi/gliner2-rs"
homepage = "https://edito-pdf.com"

[workspace.dependencies]
# One ort version for the whole workspace: mixing release candidates across
# crates would link two incompatible ONNX Runtime bindings into one binary.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std", "ndarray", "load-dynamic",
    "cuda", "rocm", "coreml", "openvino", "directml", "tensorrt", "xnnpack", "qnn", "half",
] }
ndarray = "0.17"
tokenizers = "0.23"
anyhow = "1.0"
half = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
